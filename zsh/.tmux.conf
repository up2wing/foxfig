set -g default-terminal screen-256color
set-option -ga terminal-overrides ",*256col*:Tc"
bind s choose-tree -s -O name

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'

run '~/.tmux/plugins/tpm/tpm'

# 直接 fzf 选 session，跳过菜单
bind-key f run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh switch"

set -g allow-passthrough on
# split-window 继承 shell 真实 cwd（通过 /proc/PID/cwd）
bind-key h run-shell 'tmux split-window -h -c "$(readlink /proc/#{pane_pid}/cwd)"'
bind-key v run-shell 'tmux split-window -v -c "$(readlink /proc/#{pane_pid}/cwd)"'
bind-key \" run-shell 'tmux split-window -v -c "$(readlink /proc/#{pane_pid}/cwd)"'
bind-key % run-shell 'tmux split-window -h -c "$(readlink /proc/#{pane_pid}/cwd)"'
